# IT-MANAGER | NetAlertX | Portainer Git Stack | one host port only
# IT-MANAGER convention: HOST_PORT:CONTAINER_PORT MUST BE IDENTICAL.
# NetAlertX: 18894:18894/tcp. Port 18897 remains unassigned by this stack.
# NetAlertX backend API uses internal TCP/20212 and web proxy /server; it is NOT published.
# Bridge networking limits L2 ARP/mDNS discovery; see IT-MANAGER-DEPLOY.md.
services:
  netalertx:
    image: ghcr.io/netalertx/netalertx:latest
    container_name: netalertx
    restart: unless-stopped
    read_only: true
    ports:
      - "18894:18894/tcp"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    environment:
      LISTEN_ADDR: "0.0.0.0"
      PORT: "18894"
      GRAPHQL_PORT: "20212"
      APP_CONF_OVERRIDE: '{"BACKEND_API_URL":"/server","GRAPHQL_PORT":"20212"}'
      PUID: "20211"
      PGID: "20211"
      ALWAYS_FRESH_INSTALL: "false"
      NETALERTX_DEBUG: "0"
    volumes:
      - netalertx_data:/data
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - "/tmp:uid=20211,gid=20211,mode=1700,rw,noexec,nosuid,nodev"
    mem_limit: 2048m
    mem_reservation: 1024m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - netalertx_internal

  # Optional inventory integration: lists Docker containers through a read-only
  # Engine API proxy. No second published host port, not accessible from LAN.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: netalertx-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      NETWORKS: "1"
      POST: "0"
      BUILD: "0"
      EXEC: "0"
      IMAGES: "0"
      VOLUMES: "0"
      SECRETS: "0"
      SERVICES: "0"
      TASKS: "0"
      SWARM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - netalertx_internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  netalertx_internal:

volumes:
  netalertx_data:

# NetAlertX / IT-MANAGER - single-container Portainer Git Stack.
# IMPORTANT: host networking is required for ARP discovery on a Linux Docker host.
# Host-networked services DO NOT use ports: N:N; the processes listen directly
# on host ports 18897 (web) and 18898 (GraphQL/API).
# The GraphQL API binds to 0.0.0.0:18898 in upstream NetAlertX:
# BLOCK remote access to TCP 18898 with the Docker host firewall before
# exposing the app to untrusted networks. Do not forward either port.
# Verify 18897 and 18898 are BOTH unused. Former Social Analyzer fork still
# has 18898 in an undeployed Compose, and must not run simultaneously.
services:
  netalertx:
    image: ghcr.io/netalertx/netalertx:latest
    container_name: netalertx
    restart: unless-stopped
    network_mode: host
    read_only: true

    # Upstream-recommended minimal capabilities for network discovery and
    # the service's non-root startup. Do not add privileged: true.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

    environment:
      # Host network: each listener uses the same TCP port on the Docker host.
      # LISTEN_ADDR restricts the Nginx web UI to the specified local LAN IP.
      # NOTE: This setting does NOT restrict the separately bound API listener.
      LISTEN_ADDR: "${LAN_IP:?SET_DOCKER_HOST_LAN_IP}"
      PORT: "18897"
      GRAPHQL_PORT: "18898"
      PUID: "20211"
      PGID: "20211"
      ALWAYS_FRESH_INSTALL: "false"
      NETALERTX_DEBUG: "0"

    volumes:
      - netalertx_data:/data
      - /etc/localtime:/etc/localtime:ro

    # Match the supported official image startup layout. Keep /data persistent.
    tmpfs:
      - "/tmp:mode=1700,uid=0,gid=0,rw,noexec,nosuid,nodev,async,noatime,nodiratime"

    mem_limit: 2048m
    mem_reservation: 1024m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  netalertx_data:

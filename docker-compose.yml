# IT-MANAGER | NetAlertX | Portainer Git Stack | 192.168.20.194
# Exactly ONE published host TCP port: 192.168.20.194:18897 -> container:20211.
# TCP/18894 stays FREE (not used by this stack).
# Backend API 20212 is internal; the UI uses the same-origin /server reverse proxy.
# Docker BRIDGE is mandatory for ports: host:container mapping, but limits raw
# LAN ARP/NBNS/mDNS discovery. See IT-MANAGER-DEPLOY.md before relying on scans.
# Existing NetAlertX /data volume is preserved by keeping service/volume names.
services:
  netalertx:
    image: ghcr.io/netalertx/netalertx:latest
    container_name: netalertx
    restart: unless-stopped
    read_only: true
    ports:
      - "192.168.20.194:18897:20211/tcp"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    environment:
      LISTEN_ADDR: "0.0.0.0"
      PORT: "20211"
      GRAPHQL_PORT: "20212"
      APP_CONF_OVERRIDE: '{"BACKEND_API_URL":"/server"}'
      PUID: "20211"
      PGID: "20211"
      ALWAYS_FRESH_INSTALL: "false"
      NETALERTX_DEBUG: "0"
    volumes:
      - netalertx_data:/data
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - "/tmp:uid=20211,gid=20211,mode=1700,rw,noexec,nosuid,nodev"
    mem_limit: 2048m
    mem_reservation: 1024m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - netalertx_internal

  # Optional inventory integration: lists Docker containers through a read-only
  # Engine API proxy. No second published host port, not accessible from LAN.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: netalertx-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      INFO: "1"
      NETWORKS: "1"
      POST: "0"
      BUILD: "0"
      EXEC: "0"
      IMAGES: "0"
      VOLUMES: "0"
      SECRETS: "0"
      SERVICES: "0"
      TASKS: "0"
      SWARM: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - netalertx_internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  netalertx_internal:

volumes:
  netalertx_data:
